name: C++ unit tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  unittests:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Erlang/OTP 29
      uses: erlef/setup-beam@v1
      with:
        otp-version: "29.1"

    - name: Export Erlang root for CMake
      run: |
        OTP_ROOT="$(erl -noshell -eval 'io:format("~s",[code:root_dir()]),halt().')"
        echo "_KERL_ACTIVE_DIR=${OTP_ROOT}" >> "$GITHUB_ENV"
        echo "Using _KERL_ACTIVE_DIR=${OTP_ROOT}"
        test -f "${OTP_ROOT}/usr/include/ei.h"
        test -f "${OTP_ROOT}/usr/lib/libei.a"

    - name: Prepare gtest and tools
      run: |
        # act images often run as root without sudo; GHA runners have sudo.
        if command -v sudo >/dev/null 2>&1 && [[ "$(id -u)" -ne 0 ]]; then
          SUDO=sudo
        else
          SUDO=
        fi
        $SUDO apt-get update -y
        $SUDO apt-get -y install cmake g++ libgtest-dev clang-format-14 python3-pip
        # Ubuntu 24.04: sources live under googletest/; older releases used /usr/src/gtest.
        if [[ -d /usr/src/gtest ]]; then
          GTEST_SRC=/usr/src/gtest
        else
          GTEST_SRC=/usr/src/googletest/googletest
        fi
        cd "$GTEST_SRC"
        $SUDO cmake CMakeLists.txt
        $SUDO make
        $SUDO cp lib/*.a /usr/lib 2>/dev/null || $SUDO find . -name 'libgtest*.a' -exec cp {} /usr/lib \;
        $SUDO ln -sf /usr/lib/libgtest.a /usr/local/lib/libgtest.a
        $SUDO ln -sf /usr/lib/libgtest_main.a /usr/local/lib/libgtest_main.a
        # Headers for GTEST_ROOT check in CMakeLists.txt
        $SUDO mkdir -p /usr/local/GTest/include /usr/local/GTest/lib
        $SUDO ln -sfn /usr/include/gtest /usr/local/GTest/include/gtest
        $SUDO ln -sfn /usr/lib/libgtest.a /usr/local/GTest/lib/libgtest.a
        $SUDO ln -sfn /usr/lib/libgtest_main.a /usr/local/GTest/lib/libgtest_main.a
        echo "GTEST_ROOT=/usr/local/GTest" >> "$GITHUB_ENV"

    - name: Check C++ formatting
      run: |
        export CLANG_FORMAT=clang-format-14
        ./scripts/format-cpp.sh check

    - name: Configure the scheduler build
      run: |
        # PEP 668 blocks bare pip on Ubuntu 24.04 / act images.
        python3 -m pip install --break-system-packages cogapp
        git config --global url.https://github.com/.insteadOf git://github.com/
        rm -rf deps/swm-core
        # Prefer sibling checkout (act --bind / local), else clone upstream.
        if [[ -d ../swm-core ]]; then
          ln -sfn "$(cd ../swm-core && pwd)" deps/swm-core
        else
          git clone https://github.com/openworkload/swm-core.git deps/swm-core
        fi
        # GCC 13+ -Werror=mismatched-new-delete: new[] must pair with delete[].
        # Idempotent; safe once the same fix lands on swm-core master.
        sed -i 's/\bdelete tmp;/delete[] tmp;/g' deps/swm-core/c_src/lib/wm_entity_utils.cpp
        # Ensure std::uint64_t / uint64_t are declared for generated entity headers.
        grep -q '#include <cstdint>' deps/swm-core/c_src/lib/wm_entity.h || \
          sed -i '/#pragma once/a #include <cstdint>' deps/swm-core/c_src/lib/wm_entity.h
        # Compile Erlang deps used by json-to-bin.escript before C++ build.
        ln -sf "$(command -v cog)" /usr/local/bin/cog.py || true
        make -C deps/swm-core gen compile
        cmake . -G "Unix Makefiles"

    - name: Build the scheduler
      run: make

    - name: Run the scheduler unit tests
      run: ./bin/swm-sched-tests
